<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SQA Past Exams Trainer</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#172033;--mu:#64708a;--bd:#e3e8f2;--pr:#6366f1;--pr2:#8b5cf6;--ok:#12a36b;--okb:#e6f8f0;--bad:#e5484d;--badb:#fdecec;--wn:#d98a0b;--wnb:#fff4dd;--sh:0 8px 30px rgba(40,50,90,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1120;--card:#161c30;--tx:#e8ecf8;--mu:#93a0bf;--bd:#262e48;--okb:#0f2b22;--badb:#33161a;--wnb:#2e2410;--sh:0 8px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0d1120;--card:#161c30;--tx:#e8ecf8;--mu:#93a0bf;--bd:#262e48;--okb:#0f2b22;--badb:#33161a;--wnb:#2e2410;--sh:0 8px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;width:48vmax;height:48vmax;border-radius:50%;filter:blur(90px);opacity:.28}
body::before{background:var(--pr);top:-18vmax;left:-12vmax}
body::after{background:var(--pr2);bottom:-20vmax;right:-14vmax}
.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--bd)}
.top div{max-width:900px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{font-weight:800;font-size:1.1rem;cursor:pointer;background:linear-gradient(90deg,var(--pr),var(--pr2));-webkit-background-clip:text;background-clip:text;color:transparent;flex:1}
button{font:inherit;color:inherit;cursor:pointer}
.ic{border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:8px 12px;box-shadow:var(--sh)}
main{max-width:900px;margin:auto;padding:20px 16px 60px}
.hero{text-align:center;padding:34px 8px 22px}
.hero h1{font-size:clamp(1.8rem,6vw,3rem);line-height:1.15;font-weight:850;letter-spacing:-.02em}
.hero h1 span{background:linear-gradient(90deg,var(--pr),var(--pr2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mu);margin-top:10px;max-width:560px;margin-inline:auto}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:18px}
.ex{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;box-shadow:var(--sh);cursor:pointer;text-align:left;transition:.2s;display:flex;flex-direction:column;gap:6px}
.ex:hover{transform:translateY(-4px);border-color:var(--pr)}
.ex b{font-size:1.25rem}.ex small{color:var(--mu)}
.tag{align-self:flex-start;background:linear-gradient(90deg,var(--pr),var(--pr2));color:#fff;border-radius:99px;padding:2px 12px;font-size:.78rem;font-weight:700}
.best{margin-top:8px;font-size:.88rem;color:var(--mu)}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pr),var(--pr2));transition:width .4s}
.stat{position:sticky;top:58px;z-index:10;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 16px;box-shadow:var(--sh);margin:6px 0 18px}
.stat .row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.9rem;margin-bottom:8px;font-weight:600}
.back{background:none;border:0;color:var(--pr);font-weight:700;padding:6px 0}
h2{font-size:1.5rem;margin:6px 0 2px}.sub{color:var(--mu);font-size:.9rem}
.q{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.q h3{font-size:1.02rem;font-weight:650;display:flex;gap:10px}
.n{flex:none;width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;display:grid;place-items:center;font-size:.85rem;font-weight:800}
.opts{display:grid;gap:9px;margin-top:14px}
.o{display:flex;gap:10px;text-align:left;align-items:flex-start;background:var(--bg);border:1.5px solid var(--bd);border-radius:12px;padding:11px 13px;transition:.15s;width:100%}
.o:hover:not(:disabled){border-color:var(--pr);transform:translateX(3px)}
.o:disabled{cursor:default}
.o em{font-style:normal;font-weight:800;color:var(--pr);flex:none}
.o.ok{background:var(--okb);border-color:var(--ok)}.o.ok em{color:var(--ok)}
.o.bad{background:var(--badb);border-color:var(--bad)}.o.bad em{color:var(--bad)}
.fb{margin-top:12px;border-radius:12px;padding:10px 13px;font-size:.93rem;display:none}
.fb.s{display:block}.fb.ok{background:var(--okb);color:var(--ok)}.fb.bad{background:var(--badb);color:var(--bad)}
.fb strong{display:block;font-size:1rem}
.nt{margin-top:8px;padding:9px 12px;border-radius:10px;background:var(--wnb);color:var(--tx);font-size:.88rem;border-left:4px solid var(--wn)}
.nt b{color:var(--wn)}
.res{text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:28px 18px;box-shadow:var(--sh)}
.res .big{font-size:3rem;font-weight:850;background:linear-gradient(90deg,var(--pr),var(--pr2));-webkit-background-clip:text;background-clip:text;color:transparent}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.pb{background:linear-gradient(90deg,var(--pr),var(--pr2));color:#fff;border:0;border-radius:12px;padding:10px 20px;font-weight:700}
.sb{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 20px;font-weight:700}
.pop{animation:pop .35s}@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:520px){.q{padding:14px}.stat{top:56px}}
</style>
</head>

<header class="top"><div><span class="logo" onclick="location.hash=''">SQA Exam Trainer</span><button class="ic" id="th" aria-label="Toggle theme">🌙</button></div></header>

T("A software fault can exist in the code for years without causing a failure if the faulty condition is never triggered.",0),

T("Software reliability is defined by the system’s ability to operate without failure for a specified time and under defined conditions.",0),

T("Interoperability ensures a system can communicate and function with other systems through standard protocols.",0),

]},

Q("______ is the hardware resources needed to perform all the functions of the software system in conformance to all other requirements.",["Integrity","Efficiency","Usability"],1),

Q("Which of the following is NOT a maturity level in CMM?",["Repeatable","Design","Managed"],1),
Q("Repeated testing of an already tested program, after modification, to discover defects introduced or uncovered as a result of the changes:",["Re-testing","Confirmation testing","Regression testing","Negative testing"],2),

Q("What is beta testing?",["Testing by potential customers at the developers’ location","Testing by potential customers at their own locations","Testing by product developers at the customers’ location","Testing by product developers at their own location"],1),
Q("In ______ Baldrige criteria, it examines the organization’s performance and improvement in its key business area.",["Measurements","Process management","Results"],2),

Q("Which is non-functional testing?",["Performance testing","Unit testing","Regression testing","Sanity testing"],0),
T("Kickoff meeting will be at the end of each stage of development, to review and analyze defects that occurred in that stage in a short meeting.",1,"That is the defect causal analysis meeting, not the kickoff."),
Q("Handover of testware is a part of which phase?",["Test analysis","Test planning","Test design","Test completion"],3),
Q("______ covers the fundamentals and defines a vocabulary for quality management systems.",["ISO 9001:2015","ISO 9011:2011","ISO 9000:2015"],2),
T("When reporting faults to developers, testers should insist on completing testing until the faults are fixed.",0,"?This question is worded confusingly; the key says True."),
Q("______ sets audit guidelines for quality management systems.",["ISO 9001:2015","ISO 9011:2011","ISO 9000:2015"],1,"?The real standard is ISO 19011:2011. The exam writes “9011”."),
Q("Software testing activity should start:",["As soon as the code is written","During the design stage","When the requirements have been formally documented","As soon as possible in the development life cycle"],3),
Q("In ______ model the whole process is divided into separate phases; the outcome of one phase acts as the input for the next.",["Iterative","Spiral","Waterfall"],2),
Q("Where may functional testing be performed?",["At system and acceptance levels only","At all test levels","At all levels above integration testing","At the acceptance level only"],1),
Q("______ characterize the state of the organization’s processes relative to an individual process area.",["Standards","Maturity","Capability"],2),
Q("The degree to which a system, component, or process meets specified requirements is ______.",["QC (Quality Control)","SQA (Software Quality Assurance)","ISO"],1,"?Sources disagree: this exam says SQA, while Mid 2024 says QC. Follow your doctor’s slides.")

Q("______ can occur in any of the software development phases throughout the life cycle.",["Bug","Error","Defect"],1),

T("Inspection includes methods based on a human review of the software artifacts.",0),
Q("______ characterize the state of the organization’s processes relative to an individual process area.",["Standards","Maturity","Capability"],2),
Q("______ covers the fundamentals and defines a vocabulary for quality management systems.",["ISO 9001:2015","ISO 9011:2011","ISO 9000:2015"],2),

const app=document.getElementById("app"),L="ABCDEFGH",best={};
const th=document.getElementById("th"),root=document.documentElement;
function setTheme(m){root.dataset.theme=m;th.textContent=m==="dark"?"☀️":"🌙";}
setTheme(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
th.onclick=()=>setTheme(root.dataset.theme==="dark"?"light":"dark");
function home(){
 app.innerHTML=`<section class="hero pop"><h1>Ace your <span>SQA midterm</span></h1><p>Pick an exam, choose an answer, and get instant right or wrong feedback with explanations.</p></section><div class="grid">${EX.map(e=>`<button class="ex pop" onclick="location.hash='${e.id}'"><span class="tag">${e.d.length} questions</span><b>${e.t}</b><small>${e.s}</small><span class="best">${best[e.id]!=null?"Best score: "+best[e.id]+"%":"Not attempted yet"}</span></button>`).join("")}</div>`;
 scrollTo(0,0);
}
function quiz(e){
 let ans=Array(e.d.length).fill(null);
 app.innerHTML=`<button class="back" onclick="location.hash=''">← All exams</button><h2>${e.t}</h2><p class="sub">${e.s}</p>
 <div class="stat"><div class="row"><span id="a">Answered 0/${e.d.length}</span><span id="c">✓ 0 · ✗ 0</span></div><div class="bar"><i id="p"></i></div></div>
 <div id="qs">${e.d.map((x,i)=>`<article class="q pop" id="q${i}"><h3><span class="n">${i+1}</span><span>${x.q}</span></h3><div class="opts">${x.o.map((o,j)=>`<button class="o" data-i="${i}" data-j="${j}"><em>${L[j]}</em><span>${o}</span></button>`).join("")}</div><div class="fb"></div></article>`).join("")}</div><div id="r"></div>`;
 scrollTo(0,0);
 const upd=()=>{
  const n=ans.filter(v=>v!==null).length,ok=ans.filter((v,i)=>v===e.d[i].a).length;
  a.textContent=`Answered ${n}/${e.d.length}`;c.textContent=`✓ ${ok} · ✗ ${n-ok}`;p.style.width=n/e.d.length*100+"%";
  if(n===e.d.length){const pc=Math.round(ok/n*100);best[e.id]=Math.max(best[e.id]||0,pc);
   r.innerHTML=`<div class="res pop"><div class="big">${pc}%</div><p>${ok} of ${n} correct · ${pc>=85?"Excellent! 🔥":pc>=60?"Good job, review the red ones.":"Keep practicing, you’ll get there."}</p><div class="btns"><button class="pb" onclick="quiz(EX.find(x=>x.id==='${e.id}'))">Retry</button><button class="sb" onclick="location.hash=''">All exams</button></div></div>`;
   r.scrollIntoView({behavior:"smooth",block:"center"});}
 };
 document.getElementById("qs").onclick=ev=>{
  const b=ev.target.closest(".o");if(!b)return;
  const i=+b.dataset.i,j=+b.dataset.j,x=e.d[i];if(ans[i]!==null)return;
  ans[i]=j;const card=document.getElementById("q"+i),bs=card.querySelectorAll(".o");
  bs.forEach(o=>o.disabled=true);bs[x.a].classList.add("ok");
  const good=j===x.a;if(!good)bs[j].classList.add("bad");
  const fb=card.querySelector(".fb");fb.className="fb s "+(good?"ok":"bad");
  let h=good?"<strong>✓ Correct!</strong>":`<strong>✗ Wrong</strong>Correct answer: ${L[x.a]}) ${x.o[x.a]}`;
  if(x.n){const f=x.n[0]==="!",d=x.n[0]==="?";h+=`<div class="nt"><b>${f?"Corrected answer: ":d?"Note: ":"Explanation: "}</b>${f||d?x.n.slice(1):x.n}</div>`;}
  fb.innerHTML=h;upd();
 };
}
function route(){const e=EX.find(x=>"#"+x.id===location.hash);e?quiz(e):home();}
addEventListener("hashchange",route);route();
</script>
</body>
</html>
